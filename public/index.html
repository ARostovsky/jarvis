<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15.5' fill='%2303080f'/><circle cx='16' cy='16' r='13' fill='none' stroke='%231b5f7a' stroke-width='1.5' stroke-dasharray='6 3'/><circle cx='16' cy='16' r='9' fill='none' stroke='%234fd8ff' stroke-width='2'/><circle cx='16' cy='16' r='4.5' fill='%234fd8ff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --panel-w: 440px; --panel-x: 16px; --panel-t: 56px; --panel-b: 16px;
    --bg: #03080f; --cyan: #4fd8ff; --cyan-dim: #1b5f7a; --amber: #ffb547; --violet: #c58bff; --red: #ff5a5a; --gray: #4a5a66;
    --text: #cfefff; --panel: rgba(6, 20, 32, .88); --line: rgba(79, 216, 255, .25);
  }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--cyan-dim) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--cyan); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Rajdhani, system-ui, sans-serif; overflow: hidden; }
  body { background: radial-gradient(ellipse at center, #08243a 0%, var(--bg) 70%); }
  #grid { position: fixed; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: .12; pointer-events: none; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; user-select: none; }
  svg.panning { cursor: grabbing; }
  /* Keep the graph centered in the space left of the panel. */
  body.panel-open svg { width: calc(100% - min(var(--panel-w), 100vw - 32px) - var(--panel-x) - 16px); }
  .node.dragging { transition: none; cursor: grabbing; }
  .node.speaking .ring { stroke-width: 3.5; }
  #log .live { color: #e6f8ff; opacity: .85; }
  #log .live::after { content: '▍'; animation: blink .8s steps(2) infinite; }
  .sublink { stroke-width: .8; opacity: .8; }
  .link { stroke: var(--cyan-dim); stroke-width: 1.2; stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .pulse { fill: var(--cyan); filter: url(#glow); }
  .pulse.note { fill: var(--violet); }
  .node { cursor: pointer; }
  .node .ring { fill: rgba(4, 30, 48, .9); stroke: var(--c, var(--cyan-dim)); stroke-width: 2; filter: url(#glow); }
  .node .halo { fill: none; stroke: var(--c, var(--cyan-dim)); stroke-width: 1; opacity: .5; stroke-dasharray: 3 9; transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
  .node.selected .ring { stroke-width: 3.5; fill: rgba(8, 52, 80, .95); }
  .node.selected text:not(.sub):not(.act) { fill: #fff; font-weight: 600; }
  .node:focus, #core:focus { outline: none; } /* the selection reticle marks the node; a browser box would only add noise */
  .node:focus-visible .ring { stroke: var(--text); } #core:focus-visible .a1 { stroke: var(--text); }
  /* Selection: a lock-on reticle around the node, its path to the arbiter lit, unrelated nodes dimmed. */
  #lock { pointer-events: none; transform-box: fill-box; transform-origin: center; animation: lockon .35s cubic-bezier(.2, .8, .2, 1); }
  #lock .br { fill: none; stroke: var(--cyan); stroke-width: 3; filter: url(#glow); transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
  #lock .tk { fill: none; stroke: var(--cyan); stroke-width: 1; opacity: .3; }
  @keyframes lockon { from { transform: scale(1.6); opacity: 0; } }
  .link.stopped { stroke: var(--gray); opacity: .5; animation: none; } /* nothing flows to a stopped agent */
  .link.lit { stroke: var(--cyan); stroke-width: 2; opacity: 1; }
  .node { transition: transform .8s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
  #nodes.focus .node:not(.selected):not(.kin):not(:hover) { opacity: .45; }
  .node text { fill: var(--text); text-anchor: middle; font-size: 15px; pointer-events: none; }
  .node .sub { fill: var(--c, var(--cyan-dim)); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .node .act { fill: #8fb8cc; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .running { --c: var(--cyan); } .running .ring { animation: breathe 1.6s ease-in-out infinite; }
  .idle { --c: var(--cyan-dim); } .waiting { --c: var(--amber); } .waiting .ring { animation: blink .8s steps(2) infinite; }
  .error { --c: var(--red); } .stopped { --c: var(--gray); }
  @keyframes breathe { 50% { stroke-width: 4; } }
  @keyframes blink { 50% { opacity: .4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #core .arc { fill: none; stroke: var(--c, var(--cyan)); filter: url(#glow); transform-box: view-box; transform-origin: 0 0; }
  #core .a1 { stroke-width: 2; stroke-dasharray: 120 40 20 40; animation: spin 18s linear infinite; }
  #core .a2 { stroke-width: 6; opacity: .35; stroke-dasharray: 2 6; animation: spin 30s linear infinite reverse; }
  #core .a3 { stroke-width: 1.5; stroke-dasharray: 60 30; animation: spin 9s linear infinite; }
  #core.running .a1 { animation-duration: 4s; } #core.running .a3 { animation-duration: 2s; }
  #core .disc { fill: url(#coreFill); filter: url(#glow); }
  #core.running .disc { animation: corepulse 1.4s ease-in-out infinite; }
  #core.speaking .disc { opacity: .75; }
  @keyframes corepulse { 50% { opacity: .65; } }
  #core text { fill: var(--text); text-anchor: middle; font-size: 22px; letter-spacing: .3em; font-weight: 600; pointer-events: none; }

  #panel { position: fixed; top: var(--panel-t); right: var(--panel-x); bottom: var(--panel-b); width: min(var(--panel-w), calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); display: none; flex-direction: column; backdrop-filter: blur(6px); }
  #panel.open { display: flex; }
  .grip { position: absolute; z-index: 1; }
  #pgrip, #pgripR { top: 0; bottom: 0; width: 10px; cursor: ew-resize; } #pgrip { left: -5px; } #pgripR { right: -5px; }
  #pgripT, #pgripB { left: 0; right: 0; height: 10px; cursor: ns-resize; } #pgripT { top: -5px; } #pgripB { bottom: -5px; }
  #pgrip:hover, #pgrip.dragging, #pgripR:hover, #pgripR.dragging { background: linear-gradient(90deg, transparent 4px, var(--cyan) 4px, var(--cyan) 6px, transparent 6px); }
  #pgripT:hover, #pgripT.dragging, #pgripB:hover, #pgripB.dragging { background: linear-gradient(180deg, transparent 4px, var(--cyan) 4px, var(--cyan) 6px, transparent 6px); }
  #panel header { cursor: move; } #panel header button { cursor: pointer; }
  #panel header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #panel h2 { margin: 0; font-size: 20px; letter-spacing: .1em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pmeta { font-size: 12px; letter-spacing: .1em; color: var(--cyan-dim); }
  #pmeta.full { color: var(--amber); }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5; }
  #log div { margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  #log .note { color: var(--violet); }
  #log table { display: block; overflow-x: auto; border-collapse: collapse; margin: 4px 0; }
  #log th, #log td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; vertical-align: top; }
  #log th { color: var(--cyan); font-weight: normal; }
  #log pre { margin: 4px 0; padding: 6px 10px; background: rgba(0, 0, 0, .3); border-left: 2px solid var(--line); overflow-x: auto; white-space: pre; }
  #log code { color: #e8d2a8; } #log strong { color: var(--text); }
  #log .tool, #log .meta { color: #8fb8cc; } #log .user, #log .outgoing { color: var(--amber); } #log .report { color: #d9b77a; } #log .result { color: var(--cyan); }
  #log.hide-user .user, #log.hide-report .report, #log.hide-outgoing .outgoing, #log.hide-tool .tool, #log.hide-note .note, #log.hide-cost .cost { display: none; }
  #viewMenu { position: absolute; top: 52px; right: 12px; z-index: 3; background: var(--panel); border: 1px solid var(--cyan); padding: 8px 12px; display: none; font-size: 14px; }
  #viewMenu.open { display: block; }
  #viewMenu label { display: flex; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; white-space: nowrap; }
  #viewMenu input { flex: none; width: auto; accent-color: var(--cyan); }
  #direct { display: flex; border-top: 1px solid var(--line); }
  #asks { position: fixed; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100vw - 32px)); }
  .ask { background: var(--panel); border: 1px solid var(--amber); padding: 10px 12px; backdrop-filter: blur(8px); }
  .ask pre { margin: 6px 0; max-height: 120px; overflow: auto; font-size: 11px; color: #e8d2a8; white-space: pre-wrap; word-break: break-all; }
  input, #dinput { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: 16px Rajdhani, sans-serif; padding: 14px 16px; outline: none; }
  #dinput { resize: none; max-height: 40vh; line-height: 1.3; }
  #dinput::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { background: transparent; border: 0; border-left: 1px solid var(--line); color: var(--cyan); font: 600 14px Rajdhani, sans-serif; letter-spacing: .15em; padding: 0 16px; cursor: pointer; }
  button:hover, button:focus-visible { background: rgba(79, 216, 255, .12); outline: none; }
  .ask button { border: 1px solid var(--line); padding: 6px 14px; margin-right: 6px; }
  .ask .deny, .danger { color: var(--red); }
  #asks { max-height: calc(100vh - 32px); overflow: auto; }
  .ask button:disabled { opacity: .4; cursor: default; }
  .q { margin: 10px 0; }
  .q .chip { display: inline-block; border: 1px solid var(--amber); color: var(--amber); font-size: 11px; letter-spacing: .1em; padding: 0 6px; margin-right: 6px; }
  .q .opts { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .ask .q .opts button { text-align: left; margin: 0; letter-spacing: 0; padding: 6px 10px; color: var(--text); }
  .ask .q .opts button.on { border-color: var(--amber); background: rgba(255, 181, 71, .12); }
  .q .opts small { display: block; font-weight: 400; color: var(--gray); }
  .q .opts pre { margin: 4px 0 0; white-space: pre; max-height: 260px; }
  .q input { border: 1px solid var(--line); padding: 6px 10px; font-size: 14px; width: 100%; box-sizing: border-box; margin-top: 4px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--amber); padding: 20px 24px; max-width: 640px; }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h3 { margin: 0 0 8px; letter-spacing: .15em; color: var(--amber); }
  dialog pre { font-size: 12px; color: #e8d2a8; max-height: 200px; overflow: auto; }
  dialog button { border: 1px solid var(--line); padding: 8px 14px; margin-right: 6px; }
  #toast { position: fixed; top: 48px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--red); color: #ffd0d0; padding: 10px 16px; font-size: 14px; max-width: 60vw; display: none; }
  #toast.show { display: block; }
  #hint { position: fixed; top: 36px; right: 16px; font-size: 11px; letter-spacing: .2em; color: var(--cyan-dim); opacity: .6; pointer-events: none; white-space: nowrap; }
  #tabs { position: fixed; top: 8px; left: 16px; right: 400px; /* clears LINK and the DRAG hint */ display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding: 4px 0; z-index: 2; }
  body.panel-open #tabs { right: max(400px, calc(min(var(--panel-w), 100vw - 32px) + var(--panel-x) + 16px)); }
  #tabs button { flex: none; white-space: nowrap; border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; display: flex; gap: 8px; align-items: center; color: var(--cyan-dim); }
  #tabs button.active { color: var(--text); border-color: var(--cyan); box-shadow: 0 0 8px rgba(79, 216, 255, .35); }
  #tabs .dot { width: 7px; height: 7px; border-radius: 50%; }
  #tabs .dot.run { background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }
  #tabs .dot.wait { background: var(--amber); animation: blink .8s steps(2) infinite; }
  #newws label { display: block; margin: 10px 0 4px; font-size: 12px; letter-spacing: .15em; color: var(--cyan-dim); }
  #newws input, #newws select { width: 100%; border: 1px solid var(--line); padding: 8px 10px; background: transparent; color: var(--text); font: 16px Rajdhani, sans-serif; }
  #newws option { background: #06141f; }
  #newws { border-color: var(--cyan); min-width: 420px; }
  #archived { border-color: var(--cyan); min-width: 480px; }
  #archivedList div { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #archivedList span { flex: 1; }
  #archivedList small { color: var(--cyan-dim); display: block; }
  #menu { position: fixed; z-index: 10; background: var(--panel); border: 1px solid var(--cyan); min-width: 200px; display: none; box-shadow: 0 0 12px rgba(79, 216, 255, .25); }
  #menu.open { display: block; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); padding: 10px 14px; }
  #menu button:last-child { border-bottom: 0; }
  #conn { position: fixed; top: 16px; right: 16px; font-size: 12px; letter-spacing: .2em; color: var(--cyan-dim); }
</style>
</head>
<body>
<div id="grid"></div>
<nav id="tabs" aria-label="Workspaces"></nav>
<div id="menu" role="menu"></div>
<div id="conn">LINK…</div>
<div id="hint">DRAG TO PAN · WHEEL TO ZOOM · DOUBLE-CLICK TO RESET</div>
<svg id="view" viewBox="-600 -400 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="Agent graph">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="coreFill"><stop offset="0" stop-color="#bff3ff"/><stop offset=".35" stop-color="#4fd8ff" stop-opacity=".8"/><stop offset="1" stop-color="#0a3a55" stop-opacity=".2"/></radialGradient>
  </defs>
  <g id="world">
  <g id="links"></g>
  <g id="pulses"></g>
  <g id="nodes"></g>
  <g id="core" class="idle" role="button" tabindex="0" aria-label="Jarvis" style="cursor:pointer">
    <circle class="arc a2" r="96"/>
    <circle class="arc a1" r="80"/>
    <circle class="arc a3" r="64"/>
    <circle class="disc" r="44"/>
    <text y="150">JARVIS</text> <!-- below the selection reticle (r 118) -->
  </g>
  </g>
</svg>

<div id="asks"></div>
<div id="toast" role="alert"></div>
<dialog id="newws">
  <h3 style="color:var(--cyan)">NEW WORKSPACE</h3>
  <form method="dialog" id="newwsForm">
    <label for="wsName">NAME</label><input id="wsName" required autocomplete="off">
    <label for="wsProject">PROJECT FOLDER (OPTIONAL)</label><input id="wsProject" placeholder="/home/you/IdeaProjects/something" autocomplete="off">
    <div style="display:flex;gap:12px">
      <div style="flex:1"><label for="wsModel">JARVIS MODEL</label><select id="wsModel"><option value="">from settings</option><option>opus</option><option>sonnet</option><option>haiku</option></select></div>
      <div style="flex:1"><label for="wsEffort">JARVIS EFFORT</label><select id="wsEffort"><option>low</option><option selected>medium</option><option>high</option><option>xhigh</option><option>max</option></select></div>
    </div>
    <p style="margin-top:16px"><button value="ok">CREATE</button><button value="" formnovalidate>CANCEL</button></p>
  </form>
</dialog>
<dialog id="choice">
  <h3 id="choiceTitle"></h3>
  <pre id="choiceText"></pre>
  <p id="choiceQuestion"></p>
  <form method="dialog" id="choiceButtons"></form>
</dialog>
<dialog id="archived">
  <h3 style="color:var(--cyan)">ARCHIVED WORKSPACES</h3>
  <p style="font-size:13px;opacity:.8">Restoring brings back the graph, logs and conversations, and re-creates agent worktrees from their jarvis/&lt;id&gt; branches.</p>
  <div id="archivedList"></div>
  <form method="dialog"><button value="">CLOSE</button></form>
</dialog>

<aside id="panel">
  <div id="pgrip" class="grip" title="Drag to resize · double-click to reset"></div><div id="pgripT" class="grip" title="Drag to resize · double-click to reset"></div><div id="pgripB" class="grip" title="Drag to resize · double-click to reset"></div><div id="pgripR" class="grip" title="Drag to resize · double-click to reset"></div>
  <header title="Drag to move · double-click to reset"><div style="flex:1;min-width:0"><h2 id="ptitle"></h2><div id="pmeta"></div></div><button id="pview" title="What to show in the log">VIEW</button><button id="pcompact" title="Summarize the conversation to free context (/compact)">COMPACT</button><button id="pstop">STOP</button><button id="pdelete" class="danger">DELETE</button><button id="pclose" aria-label="Close">✕</button></header>
  <div id="viewMenu"></div>
  <div id="log"></div>
  <form id="direct"><textarea id="dinput" rows="1" placeholder="Message…" autocomplete="off"></textarea><button>SEND</button></form>
</aside>


<script>
const ARBITER = 'arbiter', R = 300; // internal id, shown as Jarvis
const who = (id) => (id === ARBITER ? 'jarvis' : id);
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent?.appendChild(e);
  return e;
};
const short = (s, n) => (s = String(s ?? '').replace(/\s+/g, ' ')).length > n ? s.slice(0, n) + '…' : s;

const agents = new Map(); // id -> { agent, g, link, log: [] }
let selected = null;

const pos = (id) => {
  if (id === ARBITER || id === 'user') return id === 'user' ? { x: 0, y: 400 } : { x: 0, y: 0 };
  return agents.get(id)?.p ?? { x: 0, y: 0 };
};

const kidsOf = (id) => [...agents.values()].filter((a) => (a.agent.parentId ?? ARBITER) === id && a.agent.id !== ARBITER);

// Arbiter's agents sit on the main ring; sub-agents fan out from their parent, away from the center.
const SUB_GAP = 190; // node plus its widest status label, e.g. "WAITING · SONNET · MEDIUM"
function layout() {
  kidsOf(ARBITER).forEach((a, i, all) => {
    const t = -Math.PI / 2 + (i * 2 * Math.PI) / all.length;
    // Stretch the ring to the window's shape so wide screens get used.
    const rx = R * Math.min(Math.max(screenAspect() * 0.85, 1.2), 2.4);
    if (!a.pinned) a.p = { x: Math.cos(t) * rx, y: Math.sin(t) * R };
    place(a);
    const subs = kidsOf(a.agent.id);
    const base = Math.atan2(a.p.y, a.p.x);
    // Siblings must sit SUB_GAP apart so their status labels don't overlap; many siblings move further out instead of wrapping around.
    const dist = Math.max(SUB_GAP, (SUB_GAP * (subs.length - 1)) / 2.4);
    const step = 2 * Math.asin(SUB_GAP / (2 * dist));
    subs.forEach((c, j) => {
      const u = base + (j - (subs.length - 1) / 2) * step;
      if (!c.pinned) c.p = { x: a.p.x + Math.cos(u) * dist, y: a.p.y + Math.sin(u) * dist };
      place(c);
    });
  });
  fit();
}

// Until the user pans or zooms, keep every node in view.
let userView = false;
const HOME = { x: -600, y: -400, w: 1200, h: 800 };
function fit() {
  if (userView) return;
  // Fit the actual content (core with its label, nodes with theirs) plus a margin, not a fixed home box.
  let x0 = -150, y0 = -140, x1 = 150, y1 = 170;
  agents.forEach((a) => {
    if (!a.p || a.agent.id === ARBITER) return;
    x0 = Math.min(x0, a.p.x - 110); x1 = Math.max(x1, a.p.x + 110);
    y0 = Math.min(y0, a.p.y - 70); y1 = Math.max(y1, a.p.y + 100);
  });
  const pad = 40;
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  // Never zoom in so far that a lone core fills the screen.
  const minH = 560;
  if (y1 - y0 < minH) { const c = (y0 + y1) / 2; y0 = c - minH / 2; y1 = c + minH / 2; }
  // Grow the short side so the viewBox matches the window: no letterboxing.
  let w = x1 - x0, h = y1 - y0;
  const asp = screenAspect();
  if (w / h < asp) w = h * asp; else h = w / asp;
  Object.assign(vb, { x: (x0 + x1 - w) / 2, y: (y0 + y1 - h) / 2, w, h });
  applyVB();
}
const screenAspect = () => { const r = $('view').getBoundingClientRect(); return r.width / r.height || 1.5; };

function place(a) {
  a.g.style.transform = `translate(${a.p.x}px, ${a.p.y}px)`;
  const parentId = a.agent.parentId ?? ARBITER, o = pos(parentId);
  const dx = a.p.x - o.x, dy = a.p.y - o.y, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, (parentId === ARBITER ? 100 : 50) / d); // start at the parent's edge, not its center
  a.link.setAttribute('x1', o.x + dx * k);
  a.link.setAttribute('y1', o.y + dy * k);
  a.link.setAttribute('x2', a.p.x);
  a.link.setAttribute('y2', a.p.y);
}

// Positions of dragged nodes survive page reloads.
const posKey = () => `jarvis.positions.${WS}`;
const savedPos = () => { try { return JSON.parse(localStorage.getItem(posKey())) ?? {}; } catch { return {}; } };
function savePos(id, p) {
  try { localStorage.setItem(posKey(), JSON.stringify({ ...savedPos(), [id]: p })); } catch {}
}

function addAgent(agent) {
  if (agents.has(agent.id)) return Object.assign(agents.get(agent.id).agent, agent);
  if (agent.id === ARBITER) {
    agents.set(ARBITER, { agent, g: $('core'), log: [] });
    return setStatus(ARBITER, agent.status);
  }
  const link = el('line', { class: 'link', x1: 0, y1: 0, x2: 0, y2: 0 }, $('links'));
  const g = el('g', { class: 'node', role: 'button', tabindex: 0 }, $('nodes'));
  el('circle', { class: 'halo', r: 50 }, g);
  el('circle', { class: 'ring', r: 38 }, g);
  el('text', { y: 5 }, g).textContent = short(agent.name, 12);
  const sub = el('text', { class: 'sub', y: 64 }, g);
  const act = el('text', { class: 'act', y: 80 }, g);
  draggable(g, agent.id);
  g.oncontextmenu = (ev) => menu(ev, [
    ['Open log', () => select(agent.id)],
    ['Model…', () => pickModel(agent.id)],
    ['Effort…', () => pickEffort(agent.id)],
    ...(stoppable(agent.id) ? [['Stop', () => post('/stop', { id: agent.id })]] : []),
    ['Delete agent…', () => deleteAgentUi(agent.id), true],
  ]);
  g.onkeydown = (e) => { if (e.key === 'Enter') select(agent.id); };
  const p = savedPos()[agent.id];
  agents.set(agent.id, { agent, g, link, sub, act, log: [], p, pinned: !!p });
  if (agent.parentId && agent.parentId !== ARBITER) link.classList.add('sublink');
  setStatus(agent.id, agent.status);
  layout();
}

function removeAgent(id) {
  const a = agents.get(id);
  if (!a || id === ARBITER) return;
  a.g.remove();
  a.link.remove();
  agents.delete(id);
  if (selected === id) $('pclose').onclick();
  layout();
}

function setStatus(id, status) {
  const a = agents.get(id);
  if (!a) return;
  a.agent.status = status;
  a.g.classList.remove('running', 'idle', 'waiting', 'error', 'stopped');
  a.g.classList.add(status);
  if (a.sub) a.sub.textContent = [status, a.agent.model, a.agent.effort, ctxPct(a.agent) && `${ctxPct(a.agent)}%`].filter(Boolean).join(' · ');
  if (a.link) a.link.style.stroke = status === 'running' ? 'var(--cyan)' : '';
  a.link?.classList.toggle('stopped', status === 'stopped');
  if (id === selected) syncStop();
}

// STOP only means something while an agent is working or waiting for you.
const stoppable = (id) => ['running', 'waiting'].includes(agents.get(id)?.agent.status);
const syncStop = () => {
  $('pstop').hidden = !stoppable(selected);
  $('pcompact').hidden = stoppable(selected) || !agents.get(selected)?.agent.sessionId; // compact needs an idle session with history
};
// Share of the context window used after the last turn; 0 until the first measurement.
const ctxPct = (ag) => ag.context ? Math.round(100 * ag.context.tokens / ag.context.max) : 0;
const kTok = (n) => `${Math.round(n / 1000)}k`;

function pulse(from, to, cls = '') {
  const a = pos(from), b = pos(to);
  const dot = el('circle', { class: `pulse ${cls}`, r: 5 }, $('pulses'));
  const t0 = performance.now(), dur = 900;
  (function step(now) {
    const t = Math.min((now - t0) / dur, 1), e = t * t * (3 - 2 * t);
    dot.setAttribute('cx', a.x + (b.x - a.x) * e);
    dot.setAttribute('cy', a.y + (b.y - a.y) * e);
    dot.setAttribute('r', 5 + Math.sin(t * Math.PI) * 3);
    t < 1 ? requestAnimationFrame(step) : dot.remove();
  })(t0);
}

// `cost` is shown as a separate part of the line so the cost filter can hide just that.
function log(id, cls, text, cost) {
  const a = agents.get(id);
  if (!a) return;
  a.log.push({ cls, text, cost });
  if (selected === id) appendLog(cls, text, cost);
}
// What model an agent really runs: what its session reported, else what was asked for, else the settings default.
let settingsModel = null;
const modelLabel = (ag) => ag.runtimeModel ?? ag.model ?? settingsModel ?? '';
// Cost of an agent plus everything it spawned, recursively.
const subtreeCost = (id) => (agents.get(id)?.agent.costUsd ?? 0) + [...agents.values()].filter((c) => (c.agent.parentId ?? (c.agent.id === ARBITER ? null : ARBITER)) === id).reduce((s, c) => s + subtreeCost(c.agent.id), 0);
function renderTitle() {
  const a = agents.get(selected);
  if (!a) return;
  const name = selected === ARBITER ? 'JARVIS' : `${a.agent.name.toUpperCase()} · ${selected}`;
  const cfg = [modelLabel(a.agent), a.agent.effort ?? 'medium'].filter(Boolean).join(' · ');
  const own = a.agent.costUsd ?? 0, total = subtreeCost(selected);
  $('ptitle').textContent = name;
  $('ptitle').title = `${cfg}\n$${own.toFixed(3)} own${total > own ? `, $${total.toFixed(3)} with sub-agents` : ''}`;
  const ctx = a.agent.context;
  $('pmeta').textContent = `${cfg} · $${own.toFixed(2)}${total > own + 0.0005 ? ` (Σ $${total.toFixed(2)})` : ''}${ctx ? ` · ctx ${kTok(ctx.tokens)}/${kTok(ctx.max)} (${ctxPct(a.agent)}%)` : ''}`;
  $('pmeta').classList.toggle('full', ctxPct(a.agent) >= 80);
}
const atBottom = (box) => box.scrollHeight - box.scrollTop - box.clientHeight < 40;
// Markdown subset agents use: ``` fences, pipe tables, `code`, **bold**. Built with DOM nodes, never innerHTML, so agent text cannot inject markup.
function inlineMd(text) {
  return text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).map((p, i) => i % 2 === 0 ? document.createTextNode(p)
    : Object.assign(document.createElement(p[0] === '`' ? 'code' : 'strong'), { textContent: p[0] === '`' ? p.slice(1, -1) : p.slice(2, -2) }));
}
function renderMd(text) {
  const out = [], lines = text.split('\n'), para = [];
  const row = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  const flush = () => {
    while (para.length && !para[0].trim()) para.shift();
    while (para.length && !para.at(-1).trim()) para.pop();
    if (para.length) out.push(...inlineMd(para.join('\n')));
    para.length = 0;
  };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      flush();
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      out.push(Object.assign(document.createElement('pre'), { textContent: code.join('\n') }));
    } else if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|?(\s*:?-+:?\s*\|)+\s*:?-*:?\s*$/.test(lines[i + 1] ?? '')) {
      flush();
      const table = document.createElement('table');
      const tr = (cells, tag) => table.appendChild(document.createElement('tr')).append(...cells.map((c) => { const td = document.createElement(tag); td.append(...inlineMd(c)); return td; }));
      tr(row(l), 'th');
      for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) tr(row(lines[i]), 'td');
      i--;
      out.push(table);
    } else para.push(l);
  }
  flush();
  return out;
}
function appendLog(cls, text, cost) {
  const d = document.createElement('div');
  d.className = cls;
  if (cls === 'tool' || cls === 'meta') d.textContent = text; else d.append(...renderMd(text));
  if (cost) d.append(Object.assign(document.createElement('span'), { className: 'cost', textContent: cost }));
  const box = $('log');
  const stick = atBottom(box);
  box.appendChild(d);
  if (stick) box.scrollTop = box.scrollHeight;
}

// Reticle and lineage for the selected node. Re-inserting #lock restarts its lock-on animation.
const lock = el('g', { id: 'lock' });
el('circle', { class: 'tk' }, lock);
el('circle', { class: 'br', pathLength: 100, 'stroke-dasharray': '14 11' }, lock);
function markSelected(id) {
  document.querySelectorAll('.node.selected, .node.kin, .link.lit').forEach((n) => n.classList.remove('selected', 'kin', 'lit'));
  lock.remove();
  $('nodes').classList.toggle('focus', !!id && id !== ARBITER);
  const a = agents.get(id);
  if (!a) return;
  const [r1, r2] = id === ARBITER ? [118, 108] : [64, 56];
  lock.children[0].setAttribute('r', r1);
  lock.children[1].setAttribute('r', r2);
  a.g.prepend(lock);
  if (id === ARBITER) return;
  a.g.classList.add('selected');
  for (let p = a; p && p.agent.id !== ARBITER; p = agents.get(p.agent.parentId ?? ARBITER)) {
    p.link.classList.add('lit');
    if (p !== a) p.g.classList.add('kin');
  }
}

function select(id) {
  selected = id;
  const a = agents.get(id);
  markSelected(id);
  renderTitle();
  $('pdelete').hidden = id === ARBITER;
  syncStop();
  applyView();
  $('viewMenu').classList.remove('open');
  $('log').replaceChildren();
  if (a.agent.task) appendLog('meta', `task: ${a.agent.task}`);
  if (a.agent.cwd) appendLog('meta', `cwd: ${a.agent.cwd}`);
  a.log.forEach((l) => appendLog(l.cls, l.text, l.cost));
  $('panel').classList.add('open'); // first: a hidden panel has scrollHeight 0
  $('log').scrollTop = $('log').scrollHeight;
  document.body.classList.add('panel-open');
  $('dinput').placeholder = `Message ${id === ARBITER ? 'Jarvis' : a.agent.name}…  (Enter to send, Shift+Enter for new line)`;
  $('dinput').focus();
}

function showAsk(e) {
  if (document.querySelector(`[data-req="${CSS.escape(e.reqId)}"]`)) return;
  const card = document.createElement('div');
  card.className = 'ask';
  card.dataset.req = e.reqId;
  if (e.tool === 'AskUserQuestion' && Array.isArray(e.input?.questions)) return showQuestions(e, card);
  const title = document.createElement('div');
  title.textContent = `${e.agentId} wants ${e.tool}`;
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(e.input, null, 2);
  const yes = Object.assign(document.createElement('button'), { textContent: 'ALLOW', onclick: () => post('/answer', { reqId: e.reqId, allow: true }) });
  const no = Object.assign(document.createElement('button'), { className: 'deny', textContent: 'DENY', onclick: () => post('/answer', { reqId: e.reqId, allow: false }) });
  card.append(title, pre, yes, no);
  $('asks').append(card);
}

// AskUserQuestion: pick options (or type an answer), sent back as input.answers keyed by question text.
function showQuestions(e, card) {
  const title = document.createElement('div');
  title.textContent = `${e.agentId} asks`;
  card.append(title);
  const send = Object.assign(document.createElement('button'), { textContent: 'ANSWER', disabled: true });
  const reads = e.input.questions.map((q) => {
    const box = document.createElement('div');
    box.className = 'q';
    const chip = Object.assign(document.createElement('span'), { className: 'chip', textContent: q.header || '' });
    box.append(chip, document.createTextNode(q.question));
    const opts = document.createElement('div');
    opts.className = 'opts';
    const picked = new Set();
    for (const o of q.options || []) {
      const b = document.createElement('button');
      b.append(o.label);
      if (o.description) b.append(Object.assign(document.createElement('small'), { textContent: o.description }));
      const pre = o.preview ? Object.assign(document.createElement('pre'), { textContent: o.preview, hidden: true }) : null;
      if (pre) b.append(pre);
      b.onclick = () => {
        if (!q.multiSelect) for (const x of opts.querySelectorAll('button.on')) if (x !== b) { x.classList.remove('on'); x.querySelector('pre')?.setAttribute('hidden', ''); }
        if (!q.multiSelect) picked.clear();
        const on = b.classList.toggle('on');
        if (pre) pre.hidden = !on;
        on ? picked.add(o.label) : picked.delete(o.label);
        if (on && !q.multiSelect) other.value = '';
        check();
      };
      opts.append(b);
    }
    const other = Object.assign(document.createElement('input'), { placeholder: 'Other…' });
    other.oninput = () => {
      if (!q.multiSelect && other.value) { picked.clear(); for (const x of opts.querySelectorAll('button.on')) { x.classList.remove('on'); x.querySelector('pre')?.setAttribute('hidden', ''); } }
      check();
    };
    const notes = Object.assign(document.createElement('input'), { placeholder: 'Notes for the agent (optional)…' });
    box.append(opts, other, notes);
    card.append(box);
    return () => {
      const preview = (q.options || []).filter((o) => picked.has(o.label) && o.preview).map((o) => o.preview).join('\n\n');
      const note = Object.fromEntries([['preview', preview], ['notes', notes.value.trim()]].filter(([, v]) => v));
      return { q: q.question, answer: [...picked, other.value.trim()].filter(Boolean).join(', '), note };
    };
  });
  const check = () => { send.disabled = !reads.every((r) => r().answer); };
  send.onclick = () => {
    const all = reads.map((r) => r());
    post('/answer', { reqId: e.reqId, allow: true, answers: Object.fromEntries(all.map((r) => [r.q, r.answer])), annotations: Object.fromEntries(all.filter((r) => Object.keys(r.note).length).map((r) => [r.q, r.note])) });
  };
  const no = Object.assign(document.createElement('button'), { className: 'deny', textContent: 'SKIP', onclick: () => post('/answer', { reqId: e.reqId, allow: false }) });
  card.append(send, no);
  $('asks').append(card);
}

function speak(a) {
  a.g.classList.add('speaking');
  clearTimeout(a.speakT);
  a.speakT = setTimeout(() => a.g.classList.remove('speaking'), 120);
}
function endLive(id) {
  const a = agents.get(id);
  if (a) a.live = '';
  if (selected === id) $('log').querySelector('.live')?.remove();
}

let replaying = true;
const handlers = {
  ready: () => { replaying = false; if (!selected) select(ARBITER); },
  delta: (e) => {
    const a = agents.get(e.agentId);
    if (!a) return;
    a.live = (a.live ?? '') + e.text;
    speak(a);
    if (a.act) a.act.textContent = '…' + a.live.replace(/\s+/g, ' ').slice(-22);
    if (selected === e.agentId) {
      const box = $('log');
      const stick = atBottom(box); // follow the stream only if the user hasn't scrolled up
      let live = box.querySelector('.live');
      if (!live) { appendLog('live', ''); live = box.querySelector('.live'); }
      live.textContent = a.live;
      if (stick) box.scrollTop = box.scrollHeight;
    }
  },
  spawned: (e) => addAgent(e.agent),
  removed: (e) => removeAgent(e.agentId),
  status: (e) => setStatus(e.agentId, e.status),
  text: (e) => { endLive(e.agentId); log(e.agentId, '', e.text); },
  tool: (e) => {
    endLive(e.agentId);
    log(e.agentId, 'tool', `→ ${e.name} ${short(JSON.stringify(e.input), 400)}`);
    const a = agents.get(e.agentId);
    if (a?.act) a.act.textContent = short(e.name.replace(/^mcp__\w+?__/, ''), 18);
  },
  routed: (e) => {
    if (!replaying) pulse(e.from, e.to);
    // Messages from the user or from the agent's own parent are its inputs; from anyone else, reports.
    const input = e.from === 'user' || e.from === parentOf(e.to);
    log(e.to, input ? 'user' : 'report', `⇐ ${who(e.from)}: ${e.text}`);
    if (e.from !== 'user') log(e.from, 'outgoing', `⇒ ${who(e.to)}: ${short(e.text, 300)}`);
  },
  board: (e) => {
    const to = e.to.includes('all') ? [...agents.keys()].filter((id) => id !== e.from) : e.to;
    if (!replaying) to.forEach((id) => pulse(e.from, id, 'note'));
    log(e.from, 'note', `✎ board #${e.n} → ${e.to.map(who).join(', ')}: ${e.text}`);
    to.forEach((id) => log(id, 'note', `✎ board #${e.n} from ${who(e.from)}: ${e.text}`));
  },
  result: (e) => {
    const a = agents.get(e.agentId);
    if (a) a.agent.costUsd = e.costUsd;
    log(e.agentId, 'result', '■ done', ` · $${e.costUsd.toFixed(3)}`);
    renderTitle();
  },
  runtime: (e) => {
    const a = agents.get(e.agentId);
    if (!a) return;
    a.agent.runtimeModel = e.model;
    renderTitle();
  },
  config: (e) => {
    const a = agents.get(e.agentId);
    if (!a) return;
    if (e.model !== a.agent.model) a.agent.runtimeModel = undefined;
    Object.assign(a.agent, { model: e.model, effort: e.effort });
    setStatus(e.agentId, a.agent.status);
    renderTitle();
  },
  session: (e) => {
    const a = agents.get(e.agentId);
    if (!a) return;
    a.agent.sessionId = e.sessionId;
    if (e.agentId === selected) syncStop();
  },
  context: (e) => {
    const a = agents.get(e.agentId);
    if (!a) return;
    a.agent.context = { tokens: e.tokens, max: e.max };
    setStatus(e.agentId, a.agent.status);
    renderTitle();
  },
  compacted: (e) => log(e.agentId, 'result', `⇣ ${e.trigger === 'auto' ? 'auto-' : ''}compacted ${kTok(e.pre)}${e.post ? ` → ${kTok(e.post)}` : ''}`),
  ask: showAsk,
  answered: (e) => document.querySelector(`[data-req="${CSS.escape(e.reqId)}"]`)?.remove(),
};

// ---- workspaces (tabs) ----
let WS = (() => { try { return localStorage.getItem('jarvis.ws'); } catch { return null; } })();
let es = null;

async function refreshTabs() {
  let list, archived;
  try { ({ workspaces: list, archived, settingsModel } = await (await fetch('/workspaces')).json()); } catch { return; }
  renderTitle();
  renderArchived(archived);
  if (!list.some((w) => w.id === WS)) return switchTo(list[0].id);
  if (!es) connect();
  $('tabs').replaceChildren(...list.map((w) => {
    const b = document.createElement('button');
    b.className = w.id === WS ? 'active' : '';
    b.title = `${w.project ?? 'no project folder'} · spent $${(w.costUsd ?? 0).toFixed(2)}`;
    b.append(w.name);
    if (w.waiting) b.append(Object.assign(document.createElement('span'), { className: 'dot wait', title: `${w.waiting} waiting for you` }));
    else if (w.running) b.append(Object.assign(document.createElement('span'), { className: 'dot run', title: `${w.running} running` }));
    b.title += ' · right-click for actions';
    b.onclick = () => switchTo(w.id);
    b.ondblclick = () => renameWs(w);
    b.oncontextmenu = (ev) => menu(ev, [
      ['Rename', () => renameWs(w)],
      ['Stop all agents', () => stopAllWs(w.id)],
      ['Archive workspace', () => archiveWs(w), true],
    ]);
    return b;
  }), Object.assign(document.createElement('button'), { textContent: '+', title: 'New workspace', onclick: () => $('newws').showModal() }),
  ...(archived.length ? [Object.assign(document.createElement('button'), { textContent: `ARCHIVE ${archived.length}`, title: 'Archived workspaces', onclick: () => $('archived').showModal() })] : []));
}

async function renameWs(w) {
  const name = prompt('Rename workspace', w.name)?.trim();
  if (name && name !== w.name) {
    const r = await wsPost('/workspaces/rename', { ws: w.id, name });
    if (!r.ok) toast(`rename failed: ${r.text}`);
  }
  refreshTabs();
}

async function stopAllWs(id) {
  const r = await wsPost('/stopall', { ws: id });
  if (!r.ok) toast(`stop failed: ${r.text}`);
  refreshTabs();
}

// Right-click menu: items are [label, action, danger?].
function menu(ev, items) {
  ev.preventDefault();
  ev.stopPropagation();
  const m = $('menu');
  m.replaceChildren(...items.map(([label, run, danger]) => Object.assign(document.createElement('button'), {
    textContent: label, className: danger ? 'danger' : '', role: 'menuitem', onclick: () => { closeMenu(); run(); },
  })));
  m.classList.add('open');
  m.style.left = `${Math.min(ev.clientX, innerWidth - m.offsetWidth - 8)}px`;
  m.style.top = `${Math.min(ev.clientY, innerHeight - m.offsetHeight - 8)}px`;
  m.querySelector('button').focus();
}
const closeMenu = () => $('menu').classList.remove('open');
addEventListener('pointerdown', (ev) => { if (!ev.target.closest('#menu')) closeMenu(); });
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeMenu(); });

async function wsPost(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
  return { ok: r.ok, status: r.status, text: r.ok ? '' : await r.text() };
}

async function archiveWs(w) {
  const v = await choose(`ARCHIVE "${w.name}"?`, '',
    'Agents are stopped and the workspace moves to the archive. Nothing is deleted: committed work stays on jarvis/<id> branches, plain workdirs and logs move with it, and you can restore it any time.',
    [{ value: 'archive', label: 'ARCHIVE' }]);
  if (!v) return;
  let r = await wsPost('/workspaces/archive', { ws: w.id });
  if (r.status === 409) {
    const c = await choose('UNCOMMITTED CHANGES', r.text, "Commit them to each agent's own branch, then archive? To throw changes away instead, delete those agents one by one first.",
      [{ value: 'commit', label: 'COMMIT ALL & ARCHIVE' }]);
    if (!c) return;
    r = await wsPost('/workspaces/archive', { ws: w.id, commit: true });
  }
  if (!r.ok) return toast(`archive failed: ${r.text}`);
  WS = null;
  refreshTabs();
}

async function deleteArchivedUi(a) {
  const r = await fetch('/workspaces/archived/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: a.id }) });
  if (!r.ok) return toast(`delete failed: ${await r.text()}`);
  const info = await r.json();
  const lines = [
    `Deleted for good: the event log (graph, chats, board) of ${info.agents} agent(s) and Jarvis.`,
    info.parked.length ? `Deleted for good: plain workdirs ${info.parked.join(', ')}.` : 'No plain workdirs to delete.',
    info.branches.length ? `Kept: agent branches in your repos:\n  ${info.branches.join('\n  ')}` : 'No agent branches.',
  ].join('\n\n');
  $('archived').close();
  const v = await choose(`DELETE "${info.name}" PERMANENTLY?`, lines, 'This cannot be undone.', [{ value: 'delete', label: 'DELETE FOREVER', danger: true }]);
  if (!v) return;
  const name = prompt(`Type the workspace name to confirm: ${info.name}`);
  if (name === null) return;
  const d = await wsPost('/workspaces/archived/delete', { id: a.id, name });
  if (!d.ok) return toast(`delete failed: ${d.text}`);
  refreshTabs();
}

function renderArchived(archived) {
  $('archivedList').replaceChildren(...archived.map((a) => {
    const row = document.createElement('div');
    const label = document.createElement('span');
    label.append(a.name, Object.assign(document.createElement('small'), { textContent: `${a.project ?? 'no project folder'} · archived ${new Date(a.archivedAt).toLocaleString()}` }));
    const btn = Object.assign(document.createElement('button'), { textContent: 'RESTORE', onclick: async () => {
      const r = await wsPost('/workspaces/restore', { id: a.id });
      if (!r.ok) return toast(`restore failed: ${r.text}`);
      $('archived').close();
      switchTo(a.id);
    } });
    btn.style.border = '1px solid var(--line)';
    btn.style.padding = '6px 12px';
    const del = Object.assign(document.createElement('button'), { textContent: 'DELETE', className: 'danger', onclick: () => deleteArchivedUi(a) });
    del.style.border = '1px solid var(--line)';
    del.style.padding = '6px 12px';
    row.append(label, btn, del);
    return row;
  }));
}

function switchTo(id) {
  WS = id;
  try { localStorage.setItem('jarvis.ws', id); } catch {}
  $('pclose').onclick();
  userView = false;
  connect();
  refreshTabs();
}

$('newwsForm').onsubmit = async (ev) => {
  if (ev.submitter?.value !== 'ok') return;
  const r = await fetch('/workspaces', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: $('wsName').value.trim(), project: $('wsProject').value.trim(), model: $('wsModel').value, effort: $('wsEffort').value }) });
  if (!r.ok) return toast(`create failed: ${await r.text()}`);
  $('wsName').value = $('wsProject').value = '';
  switchTo((await r.json()).id);
};

function connect() {
  es?.close();
  es = new EventSource(`/events?ws=${encodeURIComponent(WS)}`);
  es.onopen = () => {
    $('conn').textContent = 'LINK ONLINE';
    // Snapshot is replayed on every connect, so start clean.
    agents.forEach((a, id) => { if (id !== ARBITER) { a.g.remove(); a.link.remove(); } });
    agents.clear();
    $('asks').replaceChildren();
    replaying = true;
  };
  es.onmessage = (m) => { const e = JSON.parse(m.data); handlers[e.type]?.(e); };
  es.onerror = () => { $('conn').textContent = 'LINK LOST · RETRYING'; };
}

function toast(text) {
  $('toast').textContent = text;
  $('toast').classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('show'), 6000);
}

async function post(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...data, ws: WS }) });
  if (r.ok) return;
  if (r.status === 409 && path === '/delete') return askDirty(data.id, await r.text());
  toast(`${path.slice(1)} failed: ${(await r.text()) || r.status}`);
}

$('direct').onsubmit = (ev) => {
  ev.preventDefault();
  const text = $('dinput').value.trim();
  if (text && selected) post('/send', { id: selected, text });
  $('dinput').value = '';
  $('dinput').oninput();
};
$('dinput').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('direct').requestSubmit(); } };
$('dinput').oninput = () => { const t = $('dinput'); t.style.height = 'auto'; if (t.value) t.style.height = t.scrollHeight + 'px'; }; // empty: skip, a wrapped placeholder would inflate scrollHeight
$('pclose').onclick = () => { document.activeElement?.blur(); $('panel').classList.remove('open'); document.body.classList.remove('panel-open'); selected = null; markSelected(null); };
$('pstop').onclick = () => selected && post('/stop', { id: selected });
$('pcompact').onclick = () => selected && post('/compact', { id: selected });
// Modal with a list of choices; resolves to the chosen value, or '' on cancel.
function choose(title, text, question, choices) {
  $('choiceTitle').textContent = title;
  $('choiceText').textContent = text;
  $('choiceText').hidden = !text;
  $('choiceQuestion').textContent = question;
  $('choiceButtons').replaceChildren(...[...choices, { value: '', label: 'CANCEL' }].map((c) =>
    Object.assign(document.createElement('button'), { value: c.value, textContent: c.label, className: c.danger ? 'danger' : '' })));
  $('choice').returnValue = '';
  $('choice').showModal();
  return new Promise((r) => { $('choice').onclose = () => r($('choice').returnValue); });
}

async function askDirty(id, text) {
  const v = await choose('UNCOMMITTED CHANGES', text, "Commit them to the agent's branch before deleting, or discard them?",
    [{ value: 'commit', label: 'COMMIT & DELETE' }, { value: 'discard', label: 'DISCARD & DELETE', danger: true }]);
  if (v) post('/delete', { id, dirty: v });
}
async function pickModel(id) {
  const a = agents.get(id)?.agent;
  const v = await choose('MODEL', '', `Model for ${id === ARBITER ? 'Jarvis' : a?.name}. A running session switches right away.`,
    ['haiku', 'sonnet', 'opus'].map((m) => ({ value: m, label: m === a?.model ? `${m.toUpperCase()} ✓` : m.toUpperCase() })));
  if (v) post('/config', { id, model: v });
}
async function pickEffort(id) {
  const a = agents.get(id)?.agent;
  const cur = a?.effort ?? 'medium';
  const v = await choose('EFFORT', '', `Reasoning effort for ${id === ARBITER ? 'Jarvis' : a?.name}. Higher is slower and pricier.`,
    ['low', 'medium', 'high', 'xhigh', 'max'].map((e) => ({ value: e, label: e === cur ? `${e.toUpperCase()} ✓` : e.toUpperCase() })));
  if (v) post('/config', { id, effort: v });
}
function deleteAgentUi(id) {
  if (confirm(`Delete ${id}? Its session stops and its workdir is removed. If it has uncommitted changes you will be asked what to do with them. The jarvis/<id> branch is kept.`)) post('/delete', { id });
}
$('pdelete').onclick = () => selected && deleteAgentUi(selected);
$('core').onclick = () => select(ARBITER);
$('core').oncontextmenu = (ev) => menu(ev, [
  ['Open log', () => select(ARBITER)],
  ['Model…', () => pickModel(ARBITER)],
  ['Effort…', () => pickEffort(ARBITER)],
  ['Stop all agents', () => stopAllWs(WS)],
]);
$('core').onkeydown = (e) => { if (e.key === 'Enter') select(ARBITER); };
document.onkeydown = (e) => {
  if (e.key === 'Escape') $('pclose').onclick();
  // With the panel closed, Enter or / brings back the arbiter chat.
  else if ((e.key === 'Enter' || e.key === '/') && !selected && !e.target.closest('input, textarea, dialog')) { e.preventDefault(); select(ARBITER); }
};

// ---- pan, zoom, drag ----
const svg = $('view');
const vb = { ...HOME };
const applyVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
const toWorld = (ev) => {
  const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return { x: p.x, y: p.y };
};

// Drag a node; a press without movement still counts as a click.
function draggable(g, id) {
  g.addEventListener('pointerdown', (ev) => {
    ev.stopPropagation();
    const a = agents.get(id), start = toWorld(ev), p0 = { ...(a.p ?? { x: 0, y: 0 }) };
    let moved = false;
    g.setPointerCapture(ev.pointerId);
    const move = (e) => {
      const w = toWorld(e), dx = w.x - start.x, dy = w.y - start.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      g.classList.add('dragging');
      a.p = { x: p0.x + dx, y: p0.y + dy };
      a.pinned = true;
      layout();
    };
    const up = () => {
      g.removeEventListener('pointermove', move);
      g.classList.remove('dragging');
      if (moved) savePos(id, a.p);
      else select(id);
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up, { once: true });
  });
}

svg.addEventListener('pointerdown', (ev) => {
  if (ev.target.closest('#core')) return;
  const start = toWorld(ev);
  svg.setPointerCapture(ev.pointerId);
  svg.classList.add('panning');
  const move = (e) => {
    const w = toWorld(e);
    vb.x -= w.x - start.x;
    vb.y -= w.y - start.y;
    userView = true;
    applyVB();
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerup', () => { svg.removeEventListener('pointermove', move); svg.classList.remove('panning'); }, { once: true });
});

svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const w = toWorld(ev), k = Math.exp(ev.deltaY * 0.0015);
  const nw = Math.min(Math.max(vb.w * k, 400), 4000), f = nw / vb.w;
  vb.x = w.x - (w.x - vb.x) * f;
  vb.y = w.y - (w.y - vb.y) * f;
  vb.w = nw;
  vb.h *= f;
  userView = true;
  applyVB();
}, { passive: false });

// Window or panel resize: refit, or keep the user's zoom and center while matching the new shape.
new ResizeObserver(() => {
  if (!userView) return layout();
  const cx = vb.x + vb.w / 2;
  vb.w = vb.h * screenAspect();
  vb.x = cx - vb.w / 2;
  applyVB();
}).observe(svg);

svg.addEventListener('dblclick', (ev) => {
  if (ev.target.closest('.node, #core')) return;
  userView = false;
  agents.forEach((a) => { a.pinned = false; });
  try { localStorage.removeItem(posKey()); } catch {}
  layout();
});

// Panel geometry: drag the edges to resize, the header to move; remembered across reloads, double-click resets.
const PANEL0 = { w: 440, x: 16, t: 56, b: 16 }; // t clears LINK and the DRAG hint
let panelBox = { ...PANEL0 };
try { panelBox = { ...PANEL0, ...JSON.parse(localStorage.getItem('jarvis.panel')) }; } catch {}
function setPanel(p) {
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));
  const w = clamp(p.w, 320, innerWidth - 240), t = clamp(p.t, 0, innerHeight - p.b - 200);
  panelBox = { w, t, x: clamp(p.x, 0, innerWidth - w), b: clamp(p.b, 0, innerHeight - t - 200) };
  for (const k in panelBox) document.documentElement.style.setProperty(`--panel-${k}`, `${Math.round(panelBox[k])}px`);
}
setPanel(panelBox);
addEventListener('resize', () => setPanel(panelBox));
function panelDrag(el, apply) {
  el.addEventListener('pointerdown', (ev) => {
    if (ev.button || ev.target.closest('button')) return;
    ev.preventDefault();
    const p0 = { ...panelBox }, x0 = ev.clientX, y0 = ev.clientY;
    el.setPointerCapture(ev.pointerId);
    el.classList.add('dragging');
    const move = (e) => setPanel({ ...p0, ...apply(p0, e.clientX - x0, e.clientY - y0) });
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', () => {
      el.removeEventListener('pointermove', move);
      el.classList.remove('dragging');
      try { localStorage.setItem('jarvis.panel', JSON.stringify(panelBox)); } catch {}
    }, { once: true });
  });
  el.addEventListener('dblclick', (ev) => {
    if (ev.target.closest('button')) return;
    setPanel(PANEL0);
    try { localStorage.removeItem('jarvis.panel'); } catch {}
  });
}
panelDrag($('pgrip'), (p, dx) => ({ w: p.w - dx }));
panelDrag($('pgripT'), (p, dx, dy) => ({ t: p.t + dy }));
panelDrag($('pgripB'), (p, dx, dy) => ({ b: p.b - dy }));
panelDrag($('pgripR'), (p, dx) => { dx = Math.min(Math.max(dx, 320 - p.w), p.x, innerWidth - 240 - p.w); return { w: p.w + dx, x: p.x - dx }; }); // the left edge stays put
// Moving keeps the height: the vertical shift is limited by the free space above and below.
panelDrag($('panel').querySelector('header'), (p, dx, dy) => {
  dy = Math.min(Math.max(dy, -p.t), p.b);
  return { x: p.x - dx, t: p.t + dy, b: p.b - dy };
});

// Log filters, per agent. An agent without its own setting inherits from its parent, up to the arbiter.
const VIEW = [
  ['user', 'Inputs (your messages, tasks from the parent)', true],
  ['report', 'Reports from sub-agents', false],
  ['outgoing', 'Messages sent to agents', true],
  ['tool', 'Tool calls', false],
  ['note', 'Board notes', true],
  ['cost', 'Cost', true],
];
const viewKey = () => `jarvis.view.${WS}`;
const viewAll = () => { try { return JSON.parse(localStorage.getItem(viewKey())) ?? {}; } catch { return {}; } };
const saveView = (v) => { try { localStorage.setItem(viewKey(), JSON.stringify(v)); } catch {} };
const parentOf = (id) => (id === ARBITER ? null : agents.get(id)?.agent.parentId ?? ARBITER);
function shown(id, k, all = viewAll()) {
  for (let cur = id; cur; cur = parentOf(cur)) if (all[cur]?.[k] !== undefined) return all[cur][k];
  return VIEW.find((v) => v[0] === k)[2];
}
function applyView() {
  if (!selected) return;
  const all = viewAll();
  for (const [k] of VIEW) $('log').classList.toggle(`hide-${k}`, !shown(selected, k, all));
}
function renderViewMenu() {
  const id = selected, all = viewAll(), own = all[id] ?? {};
  const rows = VIEW.map(([k, label]) => {
    const l = document.createElement('label');
    const c = Object.assign(document.createElement('input'), { type: 'checkbox', checked: shown(id, k, all) });
    c.onchange = () => {
      const v = viewAll();
      v[id] = { ...v[id], [k]: c.checked };
      saveView(v);
      applyView();
      renderViewMenu();
    };
    l.append(c, label);
    if (own[k] === undefined && id !== ARBITER) l.append(Object.assign(document.createElement('small'), { textContent: 'inherited', style: 'opacity:.5' }));
    return l;
  });
  const head = Object.assign(document.createElement('div'), { textContent: id === ARBITER ? 'Jarvis (agents inherit this)' : `${agents.get(id)?.agent.name ?? id}`, style: 'font-size:12px;letter-spacing:.15em;color:var(--cyan-dim);padding-bottom:4px' });
  const reset = Object.keys(own).length && id !== ARBITER
    ? [Object.assign(document.createElement('button'), { textContent: 'RESET TO INHERITED', style: 'border:1px solid var(--line);padding:4px 10px;margin-top:6px', onclick: () => { const v = viewAll(); delete v[id]; saveView(v); applyView(); renderViewMenu(); } })]
    : [];
  $('viewMenu').replaceChildren(head, ...rows, ...reset);
}
$('pview').onclick = () => { renderViewMenu(); $('viewMenu').classList.toggle('open'); };
addEventListener('pointerdown', (ev) => { if (!ev.target.closest('#viewMenu, #pview')) $('viewMenu').classList.remove('open'); });

// Vertical wheel scrolls the tab strip sideways.
$('tabs').addEventListener('wheel', (ev) => { if (!ev.deltaY) return; ev.preventDefault(); $('tabs').scrollLeft += ev.deltaY; }, { passive: false });
refreshTabs();
setInterval(refreshTabs, 2000);
</script>
</body>

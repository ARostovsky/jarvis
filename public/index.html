<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03080f; --cyan: #4fd8ff; --cyan-dim: #1b5f7a; --amber: #ffb547; --red: #ff5a5a; --gray: #4a5a66;
    --text: #cfefff; --panel: rgba(6, 20, 32, .88); --line: rgba(79, 216, 255, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Rajdhani, system-ui, sans-serif; overflow: hidden; }
  body { background: radial-gradient(ellipse at center, #08243a 0%, var(--bg) 70%); }
  #grid { position: fixed; inset: 0; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; opacity: .12; pointer-events: none; }
  svg { position: fixed; inset: 0; width: 100%; height: 100%; }
  .link { stroke: var(--cyan-dim); stroke-width: 1.2; stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  .pulse { fill: var(--cyan); filter: url(#glow); }
  .node { cursor: pointer; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  .node .ring { fill: rgba(4, 30, 48, .9); stroke: var(--c, var(--cyan-dim)); stroke-width: 2; filter: url(#glow); }
  .node .halo { fill: none; stroke: var(--c, var(--cyan-dim)); stroke-width: 1; opacity: .5; stroke-dasharray: 3 9; transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
  .node.selected .ring { stroke-width: 3.5; }
  .node text { fill: var(--text); text-anchor: middle; font-size: 15px; pointer-events: none; }
  .node .sub { fill: var(--c, var(--cyan-dim)); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .node .act { fill: #8fb8cc; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .running { --c: var(--cyan); } .running .ring { animation: breathe 1.6s ease-in-out infinite; }
  .idle { --c: var(--cyan-dim); } .waiting { --c: var(--amber); } .waiting .ring { animation: blink .8s steps(2) infinite; }
  .error { --c: var(--red); } .stopped { --c: var(--gray); }
  @keyframes breathe { 50% { stroke-width: 4; } }
  @keyframes blink { 50% { opacity: .4; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #core .arc { fill: none; stroke: var(--c, var(--cyan)); filter: url(#glow); transform-box: view-box; transform-origin: 0 0; }
  #core .a1 { stroke-width: 2; stroke-dasharray: 120 40 20 40; animation: spin 18s linear infinite; }
  #core .a2 { stroke-width: 6; opacity: .35; stroke-dasharray: 2 6; animation: spin 30s linear infinite reverse; }
  #core .a3 { stroke-width: 1.5; stroke-dasharray: 60 30; animation: spin 9s linear infinite; }
  #core.running .a1 { animation-duration: 4s; } #core.running .a3 { animation-duration: 2s; }
  #core .disc { fill: url(#coreFill); filter: url(#glow); }
  #core.running .disc { animation: corepulse 1.4s ease-in-out infinite; }
  @keyframes corepulse { 50% { opacity: .65; } }
  #core text { fill: var(--text); text-anchor: middle; font-size: 22px; letter-spacing: .3em; font-weight: 600; pointer-events: none; }

  #panel { position: fixed; top: 16px; right: 16px; bottom: 88px; width: min(440px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); display: none; flex-direction: column; backdrop-filter: blur(6px); }
  #panel.open { display: flex; }
  #panel header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #panel h2 { margin: 0; font-size: 20px; letter-spacing: .1em; flex: 1; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.5; }
  #log div { margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }
  #log .tool { color: #8fb8cc; } #log .routed { color: var(--amber); } #log .result { color: var(--cyan); }
  #direct { display: flex; border-top: 1px solid var(--line); }
  #asks { position: fixed; left: 16px; bottom: 88px; display: flex; flex-direction: column; gap: 8px; width: min(420px, calc(100vw - 32px)); }
  .ask { background: var(--panel); border: 1px solid var(--amber); padding: 10px 12px; }
  .ask pre { margin: 6px 0; max-height: 120px; overflow: auto; font-size: 11px; color: #e8d2a8; white-space: pre-wrap; word-break: break-all; }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; border: 1px solid var(--line); background: var(--panel); }
  input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text); font: 16px Rajdhani, sans-serif; padding: 14px 16px; outline: none; }
  button { background: transparent; border: 0; border-left: 1px solid var(--line); color: var(--cyan); font: 600 14px Rajdhani, sans-serif; letter-spacing: .15em; padding: 0 16px; cursor: pointer; }
  button:hover, button:focus-visible { background: rgba(79, 216, 255, .12); outline: none; }
  .ask button { border: 1px solid var(--line); padding: 6px 14px; margin-right: 6px; }
  .ask .deny { color: var(--red); }
  #conn { position: fixed; top: 16px; left: 16px; font-size: 12px; letter-spacing: .2em; color: var(--cyan-dim); }
</style>
</head>
<body>
<div id="grid"></div>
<div id="conn">LINK…</div>
<svg viewBox="-600 -400 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="Agent graph">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="coreFill"><stop offset="0" stop-color="#bff3ff"/><stop offset=".35" stop-color="#4fd8ff" stop-opacity=".8"/><stop offset="1" stop-color="#0a3a55" stop-opacity=".2"/></radialGradient>
  </defs>
  <g id="links"></g>
  <g id="pulses"></g>
  <g id="nodes"></g>
  <g id="core" class="idle" role="button" tabindex="0" aria-label="Arbiter" style="cursor:pointer">
    <circle class="arc a2" r="96"/>
    <circle class="arc a1" r="80"/>
    <circle class="arc a3" r="64"/>
    <circle class="disc" r="44"/>
    <text y="128">ARBITER</text>
  </g>
</svg>

<div id="asks"></div>

<aside id="panel">
  <header><h2 id="ptitle"></h2><button id="pstop">STOP</button><button id="pclose" aria-label="Close">✕</button></header>
  <div id="log"></div>
  <form id="direct"><input id="dinput" placeholder="Message this agent directly…" autocomplete="off"><button>SEND</button></form>
</aside>

<form id="bar"><input id="say" placeholder="Tell the arbiter…" autocomplete="off" autofocus><button>SEND</button></form>

<script>
const ARBITER = 'arbiter', R = 300;
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent?.appendChild(e);
  return e;
};
const short = (s, n) => (s = String(s ?? '').replace(/\s+/g, ' ')).length > n ? s.slice(0, n) + '…' : s;

const agents = new Map(); // id -> { agent, g, link, log: [] }
let selected = null;

const pos = (id) => {
  if (id === ARBITER || id === 'user') return id === 'user' ? { x: 0, y: 400 } : { x: 0, y: 0 };
  return agents.get(id)?.p ?? { x: 0, y: 0 };
};

function layout() {
  const kids = [...agents.values()].filter((a) => a.agent.id !== ARBITER);
  kids.forEach((a, i) => {
    const t = -Math.PI / 2 + (i * 2 * Math.PI) / Math.max(kids.length, 1);
    a.p = { x: Math.cos(t) * R * 1.35, y: Math.sin(t) * R };
    a.g.style.transform = `translate(${a.p.x}px, ${a.p.y}px)`;
    const k = 100 / Math.hypot(a.p.x, a.p.y); // start at the core's edge, not its center
    a.link.setAttribute('x1', a.p.x * k);
    a.link.setAttribute('y1', a.p.y * k);
    a.link.setAttribute('x2', a.p.x);
    a.link.setAttribute('y2', a.p.y);
  });
}

function addAgent(agent) {
  if (agents.has(agent.id)) return Object.assign(agents.get(agent.id).agent, agent);
  if (agent.id === ARBITER) {
    agents.set(ARBITER, { agent, g: $('core'), log: [] });
    return setStatus(ARBITER, agent.status);
  }
  const link = el('line', { class: 'link', x1: 0, y1: 0, x2: 0, y2: 0 }, $('links'));
  const g = el('g', { class: 'node', role: 'button', tabindex: 0 }, $('nodes'));
  el('circle', { class: 'halo', r: 50 }, g);
  el('circle', { class: 'ring', r: 38 }, g);
  el('text', { y: 5 }, g).textContent = short(agent.name, 12);
  const sub = el('text', { class: 'sub', y: 64 }, g);
  const act = el('text', { class: 'act', y: 80 }, g);
  g.onclick = () => select(agent.id);
  g.onkeydown = (e) => { if (e.key === 'Enter') select(agent.id); };
  agents.set(agent.id, { agent, g, link, sub, act, log: [] });
  setStatus(agent.id, agent.status);
  layout();
}

function setStatus(id, status) {
  const a = agents.get(id);
  if (!a) return;
  a.agent.status = status;
  a.g.classList.remove('running', 'idle', 'waiting', 'error', 'stopped');
  a.g.classList.add(status);
  if (a.sub) a.sub.textContent = status;
  if (a.link) a.link.style.stroke = status === 'running' ? 'var(--cyan)' : '';
}

function pulse(from, to) {
  const a = pos(from), b = pos(to);
  const dot = el('circle', { class: 'pulse', r: 5 }, $('pulses'));
  const t0 = performance.now(), dur = 900;
  (function step(now) {
    const t = Math.min((now - t0) / dur, 1), e = t * t * (3 - 2 * t);
    dot.setAttribute('cx', a.x + (b.x - a.x) * e);
    dot.setAttribute('cy', a.y + (b.y - a.y) * e);
    dot.setAttribute('r', 5 + Math.sin(t * Math.PI) * 3);
    t < 1 ? requestAnimationFrame(step) : dot.remove();
  })(t0);
}

function log(id, cls, text) {
  const a = agents.get(id);
  if (!a) return;
  a.log.push({ cls, text });
  if (selected === id) appendLog(cls, text);
}
function appendLog(cls, text) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = text;
  const box = $('log');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.appendChild(d);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function select(id) {
  selected = id;
  const a = agents.get(id);
  document.querySelectorAll('.node.selected').forEach((n) => n.classList.remove('selected'));
  if (id !== ARBITER) a.g.classList.add('selected');
  $('ptitle').textContent = id === ARBITER ? 'ARBITER' : `${a.agent.name.toUpperCase()} · ${id}`;
  $('pstop').hidden = id === ARBITER;
  $('log').replaceChildren();
  if (a.agent.task) appendLog('routed', `task: ${a.agent.task}`);
  if (a.agent.cwd) appendLog('tool', `cwd: ${a.agent.cwd}`);
  a.log.forEach((l) => appendLog(l.cls, l.text));
  $('log').scrollTop = $('log').scrollHeight;
  $('panel').classList.add('open');
  $('dinput').focus();
}

function showAsk(e) {
  if (document.querySelector(`[data-req="${CSS.escape(e.reqId)}"]`)) return;
  const card = document.createElement('div');
  card.className = 'ask';
  card.dataset.req = e.reqId;
  const title = document.createElement('div');
  title.textContent = `${e.agentId} wants ${e.tool}`;
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(e.input, null, 2);
  const yes = Object.assign(document.createElement('button'), { textContent: 'ALLOW', onclick: () => post('/answer', { reqId: e.reqId, allow: true }) });
  const no = Object.assign(document.createElement('button'), { className: 'deny', textContent: 'DENY', onclick: () => post('/answer', { reqId: e.reqId, allow: false }) });
  card.append(title, pre, yes, no);
  $('asks').append(card);
}

const handlers = {
  spawned: (e) => addAgent(e.agent),
  status: (e) => setStatus(e.agentId, e.status),
  text: (e) => log(e.agentId, '', e.text),
  tool: (e) => {
    log(e.agentId, 'tool', `→ ${e.name} ${short(JSON.stringify(e.input), 400)}`);
    const a = agents.get(e.agentId);
    if (a?.act) a.act.textContent = short(e.name.replace(/^mcp__\w+?__/, ''), 18);
  },
  routed: (e) => {
    pulse(e.from, e.to);
    log(e.to, 'routed', `⇐ ${e.from}: ${e.text}`);
    if (e.from !== 'user') log(e.from, 'routed', `⇒ ${e.to}: ${short(e.text, 300)}`);
  },
  result: (e) => log(e.agentId, 'result', `■ done · $${e.costUsd.toFixed(3)}`),
  ask: showAsk,
  answered: (e) => document.querySelector(`[data-req="${CSS.escape(e.reqId)}"]`)?.remove(),
};

function connect() {
  const es = new EventSource('/events');
  es.onopen = () => {
    $('conn').textContent = 'LINK ONLINE';
    // Snapshot is replayed on every connect, so start clean.
    agents.forEach((a, id) => { if (id !== ARBITER) { a.g.remove(); a.link.remove(); } });
    agents.clear();
    $('asks').replaceChildren();
  };
  es.onmessage = (m) => { const e = JSON.parse(m.data); handlers[e.type]?.(e); };
  es.onerror = () => { $('conn').textContent = 'LINK LOST · RETRYING'; };
}

async function post(path, data) {
  const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) });
  if (!r.ok) console.warn(path, r.status, await r.text());
}

$('bar').onsubmit = (ev) => {
  ev.preventDefault();
  const text = $('say').value.trim();
  if (text) post('/say', { text });
  $('say').value = '';
};
$('direct').onsubmit = (ev) => {
  ev.preventDefault();
  const text = $('dinput').value.trim();
  if (text && selected) post('/send', { id: selected, text });
  $('dinput').value = '';
};
$('pclose').onclick = () => { $('panel').classList.remove('open'); selected = null; document.querySelectorAll('.node.selected').forEach((n) => n.classList.remove('selected')); };
$('pstop').onclick = () => selected && post('/stop', { id: selected });
$('core').onclick = () => select(ARBITER);
$('core').onkeydown = (e) => { if (e.key === 'Enter') select(ARBITER); };
document.onkeydown = (e) => { if (e.key === 'Escape') $('pclose').onclick(); };

connect();
</script>
</body>
</html>
